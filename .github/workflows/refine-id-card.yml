name: Refine ID card lanyard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference geometry
        run: |
          python3 <<'PY'
          from pathlib import Path

          marker = 'ID CARD REFERENCE OVERRIDE'
          css = Path('_next/static/css/72b8d5f822b90c6a.css')
          if marker in css.read_text(encoding='utf-8') if css.exists() else '':
              print('Reference refinement already applied.')
              raise SystemExit(0)

          old_path = 'M55 38 C18 84 18 173 39 244 C61 318 118 371 181 372 C248 373 304 330 312 263 C321 190 290 107 234 61 C202 35 165 24 126 25'
          new_path = 'M108 27 C57 49 28 112 28 205 C28 307 76 374 165 377 C254 374 302 307 302 205 C302 112 273 49 222 27'

          for p in [Path('index.html'), *Path('_next/static/chunks/app').glob('page-*.js')]:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace(old_path, new_path)
              s = s.replace('strokeWidth:"20"', 'strokeWidth:"18"')
              s = s.replace('fontSize:"7"', 'fontSize:"7.5"')
              s = s.replace('letterSpacing:"1.25"', 'letterSpacing:"1.1"')
              s = s.replace('startOffset:"3%"', 'startOffset:"1.5%"')
              s = s.replace('top:-30px;left:-10px;width:350px;height:455px', 'top:-28px;left:-10px;width:350px;height:455px')
              s = s.replace('width:270px;height:416px;padding:12px', 'width:270px;height:416px;padding:9px')
              p.write_text(s, encoding='utf-8')

          if css.exists():
              s = css.read_text(encoding='utf-8')
              s += '''\n/* ID CARD REFERENCE OVERRIDE */
.profile-id-lanyard.jsx-ff10e5f29258d38f{filter:drop-shadow(0 18px 20px rgba(0,0,0,.20))}
.profile-id-holder.jsx-ff10e5f29258d38f{box-shadow:0 28px 64px rgba(20,15,10,.30),inset 0 1px 0 rgba(255,255,255,.13),inset 0 -4px 9px rgba(0,0,0,.82)}
.profile-id-clip.jsx-ff10e5f29258d38f{width:46px;height:30px;top:-23px;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg,#f6f6f3 0%,#a6a6a2 36%,#5b5b57 54%,#e1e1dd 76%,#777773 100%);box-shadow:0 5px 12px rgba(0,0,0,.36),inset 0 1px 1px rgba(255,255,255,.9)}
.profile-id-clip.jsx-ff10e5f29258d38f:before{content:"";position:absolute;left:50%;top:-28px;width:22px;height:30px;transform:translateX(-50%);border-radius:8px 8px 2px 2px;background:linear-gradient(90deg,#111,#252525 48%,#090909);box-shadow:inset 1px 0 rgba(255,255,255,.08),inset -1px 0 rgba(255,255,255,.04);z-index:-1}
.profile-id-clip.jsx-ff10e5f29258d38f:after{content:"";position:absolute;left:50%;bottom:-12px;width:16px;height:16px;transform:translateX(-50%);border:3px solid #9d9d99;border-radius:50%;background:transparent;box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.65)}
.profile-id-clip.jsx-ff10e5f29258d38f span.jsx-ff10e5f29258d38f{bottom:-22px;width:9px;height:14px;background:linear-gradient(90deg,#6b6b67,#ededE9,#73736f);box-shadow:0 2px 4px rgba(0,0,0,.4)}
@media(max-width:800px){.profile-id-holder.jsx-ff10e5f29258d38f{padding:8px}.profile-id-lanyard.jsx-ff10e5f29258d38f{top:-25px}}
'''
              css.write_text(s, encoding='utf-8')
          PY
      - name: Commit refinement
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html _next/static/chunks/app _next/static/css/72b8d5f822b90c6a.css
          git commit -m 'Refine ID card lanyard'
          git push
